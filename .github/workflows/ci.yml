name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (CPU wheel override for CI runners)
        run: uv sync --extra dev

      - name: Lint with Ruff
        run: uv run ruff check src tests relatorio

      - name: Type-check with Mypy
        run: uv run mypy src relatorio

      - name: Run Pytest suite (anti-leakage, invariants, CQR, Venn-Abers, GNN & API)
        run: uv run pytest -v --cov=fidc_risk --cov-report=term-missing
